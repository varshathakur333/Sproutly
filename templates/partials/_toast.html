{% comment %}
  Context variable: message — a Django Message object
{% endcomment %}
<div class="toast toast--{{ message.tags }}" role="alert" aria-live="assertive" aria-atomic="true">
  <div class="toast__body">
    <span class="toast__icon">
      {% if message.tags == "success" %}✅
      {% elif message.tags == "error" or message.tags == "danger" %}❌
      {% elif message.tags == "warning" %}⚠️
      {% else %}ℹ️
      {% endif %}
    </span>
    <span class="toast__text">{{ message }}</span>
  </div>
  <button class="toast__close" onclick="this.closest('.toast').remove()" aria-label="Dismiss notification">×</button>
</div>
